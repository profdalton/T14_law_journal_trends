name: Weekly journal scan on: schedule: - cron: "0 6 * * 1" workflow_dispatch: {} permissions: contents: write jobs: scrape: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - uses: actions/setup-python@v5 with: python-version: "3.12" - name: Install dependencies run: pip install -r scraper/requirements.txt - name: Run scraper env: ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} run: python scraper/scrape.py - name: Commit updated data run: | git config user.name "docket-bot" git config user.email "actions@github.com" git add data/articles.json git diff --quiet --cached || git commit -m "Weekly scan: $(date -u +'%Y-%m-%d')" git push
